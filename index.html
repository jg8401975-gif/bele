<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assunto Importante</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#075E54,#128C7E,#25D366);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#fff;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h1{
    color:#075E54;
    margin-bottom:15px;
}

.assunto{
    background:#f2f2f2;
    border-left:5px solid #25D366;
    padding:15px;
    border-radius:10px;
    margin:20px 0 25px;
    font-size:18px;
    font-weight:bold;
    color:#333;
}

.botao{
    display:block;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:16px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.botao:hover{
    background:#1EBE5D;
    transform:scale(1.03);
}
</style>
</head>

<body>

<div class="card">

    <h1>📩 Assunto Importante</h1>

    <div class="assunto">
        Assunto importante senhorita Bele
    </div>

    <a class="botao"
       href="https://wa.me/5586994446800?text=Assunto%20importante%20senhorita%20Bele"
       target="_blank">
       💬 Entrar em contato
    </a>

</div>

</body>
</html>
